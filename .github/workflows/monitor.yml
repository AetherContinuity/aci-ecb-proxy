name: canary-monitor

# Watches six proxy routes for silent failure — a canary that stops
# moving, or a response whose byte content changes while claiming
# nothing did. See monitor.py's module docstring for what this checks
# and, just as importantly, what it deliberately does not (it does not
# decide how much silence is too much per series — that needs measured
# thresholds, not guessed ones).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canary-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testit
        run: python3 test_monitor.py

      - name: Kaappaus
        run: python3 monitor.py

      - name: Commit
        run: |
          git config user.name  "aci-ecb-proxy-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add monitor/
          if git diff --cached --quiet; then
            echo "ei muutoksia"
          else
            git commit -m "canary-monitor: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
